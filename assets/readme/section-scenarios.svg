<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="150" viewBox="0 0 1200 150" role="img" aria-labelledby="t d">
  <title id="t">适用场景</title>
  <desc id="d">章节标题：什么时候调用这个技能 — 从关键词研究到惩罚恢复。</desc>
  <rect width="1200" height="150" rx="20" fill="#10151F"/>
  <text x="64" y="78" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="44" font-weight="700" fill="#F2F5F9">适用场景</text>
  <text x="64" y="116" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="21" fill="#8B96A8">从选词、建站到救火 —— 六类问题，触境即决</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="26">
    <text x="960" y="70" fill="#F2F5F9">#4</text>
    <text x="1020" y="70" fill="#4285F4">#1</text>
    <text x="1080" y="70" fill="#8B96A8">#9</text>
  </g>
  <line x1="64" y1="34" x2="180" y2="34" stroke="#4285F4" stroke-width="3"/>
</svg>
